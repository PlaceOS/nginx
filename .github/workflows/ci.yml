name: CI
on: push
jobs:
  dockerfile-style:
    name: "Lint Dockerfile"
    uses: PlaceOS/.github/.github/workflows/dockerfile-style.yml@main

  nginx-config:
    runs-on: ubuntu-latest
    name: "Test config/nginx.conf.template"
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag placeos-nginx .
      # The entrypoint renders the template, then passes -t to OpenResty,
      # which checks the config and exits
      - run: docker run --rm --env PLACE_DOMAIN=localhost --env SECRET_KEY_BASE=ci placeos-nginx -t
